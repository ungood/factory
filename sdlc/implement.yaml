document:
  dsl: '1.0.4'
  namespace: factory
  name: implement
  version: '0.1.0'
  summary: Take a GitHub issue to a draft pull request that passes the repo's checks.
do:
  # Input: {"repo": "<path to a checkout>", "issue": <number>}
  - remember:
      set:
        repo: ${ .repo }
        issue: ${ .issue | tostring }
      export:
        as: '.'
  - agent:
      run:
        shell:
          command: sdlc/bin/agent "$1" "$2"
          arguments:
            - ${ $context.repo }
            - ${ $context.issue }
      output:
        as: ${ fromjson }
      export:
        as: '$context + .'
  - gate:
      run:
        shell:
          command: sdlc/bin/gate "$1"
          arguments:
            - ${ $context.worktree }
  - pullRequest:
      run:
        shell:
          command: sdlc/bin/open-pr "$1" "$2" "$3" "$4"
          arguments:
            - ${ $context.worktree }
            - ${ $context.issue }
            - ${ $context.title }
            - ${ $context.summary }
      export:
        as: '$context + { pullRequest: . }'
  # Never fails: if Orca can't be updated, that's logged, and the run goes on.
  - announce:
      run:
        shell:
          command: sdlc/bin/announce-pr "$1" "$2" "$3" "$4"
          arguments:
            - ${ $context.repo }
            - ${ $context.issue }
            - ${ $context.worktree }
            - ${ $context.pullRequest }
  # Never fails: a failed retrospective is logged, and the pull request stands.
  - retro:
      run:
        shell:
          command: sdlc/bin/retro "$1" "$2" "$3" "$4" "$5"
          arguments:
            - ${ $context.repo }
            - ${ $context.issue }
            - ${ $context.worktree }
            - ${ $context.pullRequest }
            - ${ $workflow.id }
      output:
        as: '{ pullRequest: $context.pullRequest, branch: $context.branch, worktree: $context.worktree, retro: fromjson }'
