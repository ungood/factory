monorepo_root = true

[settings]
# mise's versions service doesn't list new place releases yet, so ask GitHub directly.
use_versions_host = false

[monorepo]
config_roots = ["*"]

[tools]
"packslip:github.com/ungood/place" = "0.1.0"
# The SDLC runs on a released marche, never the checkout being worked on, so a
# broken marche can't break the factory that fixes it.
"packslip:github.com/ungood/marche" = "0.2.0"
# The Temporal CLI, whose dev server keeps the SDLC's runs.
"aqua:temporalio/cli" = "1.9.1"
rumdl = "0.2.79"
shellcheck = "0.11.0"
bats = "1.14.0"

[tasks.sync]
description = "Clone and update the repos listed in place.toml"
run = "place sync"

[tasks.link]
description = "Use a build of the ./place checkout instead of the released place"
depends = ["//...:build"]
run = [
  "mise link --force packslip:github.com/ungood/place@local place/target/debug",
  "mise use --env local packslip:github.com/ungood/place@local",
]

[tasks.lint]
description = "Lint the Markdown, the SDLC's scripts and its workflows"
run = [
  "rumdl check",
  "shellcheck sdlc/run-tests sdlc/bin/* sdlc/test/*.bats sdlc/test/*.bash",
  "for f in sdlc/*.yaml; do marche validate \"$f\" || exit 1; done",
]

[tasks.test]
description = "Test the SDLC's scripts against a clean export of HEAD, the way a run gets them"
run = "sdlc/run-tests"

[tasks."sdlc:server"]
description = "Run the Temporal dev server that keeps the SDLC's runs"
run = [
  "mkdir -p ~/.local/state/marche",
  "temporal server start-dev --db-filename ~/.local/state/marche/temporal.db",
]

[tasks."sdlc:worker"]
description = "Run the marche worker that executes the SDLC's runs"
run = "marche worker"

[tasks.implement]
description = "Take a GitHub issue through a pull request and its review until a person merges it"
usage = '''
arg "<repo>" help="Path to the repo's checkout, such as place or ."
arg "<issue>" help="The issue number"
'''
run = 'marche run sdlc/implement.yaml --input "{\"repo\": \"${usage_repo}\", \"issue\": ${usage_issue}}"'
